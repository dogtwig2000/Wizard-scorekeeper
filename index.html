<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wizard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --label-primary: #ffffff;
            --label-secondary: #ebebf599;
            --label-tertiary: #ebebf54d;
            --separator: #38383a;
            --fill-primary: #787880;
            --fill-secondary: #78788033;
            --fill-tertiary: #7676801f;
            --system-blue: #0a84ff;
            --system-green: #30d158;
            --system-orange: #ff9f0a;
            --system-red: #ff453a;
            --system-gray: #8e8e93;
            --system-gray2: #636366;
            --system-gray3: #48484a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            background: var(--bg-primary);
            color: var(--label-primary);
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            position: fixed;
            width: 100%;
        }

        .screen {
            display: none;
            height: 100vh;
            padding-top: env(safe-area-inset-top);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            animation: slideIn 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateX(100%);
            }
            to { 
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* iOS Navigation Bar */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 44px;
            flex-shrink: 0;
            border-bottom: 0.5px solid var(--separator);
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--system-blue);
            font-size: 17px;
            font-weight: 400;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.2s;
        }

        .nav-back:active {
            opacity: 0.3;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .nav-action {
            color: var(--system-blue);
            font-size: 17px;
            font-weight: 400;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .nav-action:active {
            opacity: 0.3;
        }

        /* iOS Large Title */
        .large-title-section {
            padding: 8px 20px 16px;
            flex-shrink: 0;
        }

        .large-title {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 13px;
            color: var(--label-secondary);
            margin-top: 4px;
            font-weight: 400;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 0 0 20px;
            overflow-y: auto;
            min-height: 0;
        }

        /* iOS List Groups */
        .list-group {
            margin: 16px 0;
        }

        .list-header {
            padding: 0 20px 6px;
            font-size: 13px;
            color: var(--label-secondary);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -0.08px;
        }

        .list {
            background: var(--bg-secondary);
            margin: 0 16px;
            border-radius: 10px;
            overflow: hidden;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            border-bottom: 0.5px solid var(--separator);
            min-height: 44px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:active {
            background: var(--bg-tertiary);
        }

        .list-item.selected {
            background: var(--fill-tertiary);
        }

        .list-item.dealer {
            background: rgba(255, 159, 10, 0.15);
        }

        /* Checkbox */
        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--system-gray2);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .checkbox.checked {
            background: var(--system-blue);
            border-color: var(--system-blue);
        }

        .checkbox.checked::after {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .list-label {
            flex: 1;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.4px;
        }

        .list-label.dealer {
            color: var(--system-orange);
            font-weight: 600;
        }

        .list-value {
            font-size: 17px;
            color: var(--label-secondary);
            font-weight: 400;
        }

        /* Buttons */
        .button-group {
            padding: 0 16px 80px;
            flex-shrink: 0;
        }

        .btn-primary {
            width: 100%;
            height: 50px;
            background: var(--system-blue);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .btn-secondary {
            width: 100%;
            height: 50px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 10px;
            color: var(--system-blue);
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.4px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.15s;
        }

        .btn-secondary:active {
            opacity: 0.5;
        }

        .btn-orange {
            background: var(--system-orange);
            color: #000;
            font-weight: 600;
        }

        /* Input */
        .input-group {
            background: var(--bg-secondary);
            margin: 16px 16px;
            border-radius: 10px;
            overflow: hidden;
        }

        .input-wrapper {
            padding: 11px 16px;
        }

        input[type="text"] {
            width: 100%;
            background: none;
            border: none;
            color: var(--label-primary);
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.4px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--label-tertiary);
        }

        /* Round Badge */
        .round-badge {
            background: var(--label-primary);
            color: var(--bg-primary);
            font-size: 15px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.5px;
        }

        /* Score Entry */
        .score-entry {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 0.5px solid var(--separator);
            min-height: 72px;
        }

        .score-entry:last-child {
            border-bottom: none;
        }

        .score-entry.dealer {
            background: rgba(255, 159, 10, 0.1);
        }

        .entry-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .entry-name {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .entry-name.dealer {
            color: var(--system-orange);
        }

        .entry-detail {
            font-size: 15px;
            color: var(--label-secondary);
        }

        .entry-bid {
            color: var(--system-green);
            font-weight: 600;
        }

        .entry-points {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .entry-points.positive {
            background: rgba(48, 209, 88, 0.2);
            color: var(--system-green);
        }

        .entry-points.negative {
            background: rgba(255, 69, 58, 0.2);
            color: var(--system-red);
        }

        .entry-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            width: 36px;
            height: 36px;
            background: var(--fill-tertiary);
            border: none;
            border-radius: 8px;
            color: var(--system-blue);
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-btn:active {
            transform: scale(0.92);
            background: var(--fill-secondary);
        }

        .control-btn.green {
            color: var(--system-green);
        }

        .control-btn.orange {
            color: var(--system-orange);
        }

        .control-value {
            min-width: 32px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Status Indicator */
        .status-indicator {
            margin: 16px 16px;
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        .status-indicator.happy {
            background: rgba(48, 209, 88, 0.15);
        }

        .status-indicator.unhappy {
            background: rgba(255, 69, 58, 0.15);
        }

        .status-icon {
            font-size: 32px;
            line-height: 1;
        }

        /* Scoreboard */
        .scoreboard {
            margin: 16px 16px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .scoreboard-header {
            padding: 12px 16px;
            border-bottom: 0.5px solid var(--separator);
            font-size: 13px;
            color: var(--label-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .scoreboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 16px;
            border-bottom: 0.5px solid var(--separator);
        }

        .scoreboard-item:last-child {
            border-bottom: none;
        }

        .scoreboard-name {
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.4px;
        }

        .scoreboard-value {
            font-size: 20px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
        }

        .scoreboard-value.positive {
            color: var(--system-green);
        }

        .scoreboard-value.negative {
            color: var(--system-red);
        }

        /* Winner Card */
        .winner-card {
            margin: 32px 16px 24px;
            background: linear-gradient(135deg, var(--system-orange) 0%, #ffb84d 100%);
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(255, 159, 10, 0.3);
        }

        .winner-label {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(0, 0, 0, 0.6);
            margin-bottom: 8px;
        }

        .winner-name {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #000;
            margin-bottom: 8px;
        }

        .winner-score {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #000;
        }

        /* Order Controls */
        .order-controls {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-btn {
            width: 32px;
            height: 20px;
            background: var(--fill-tertiary);
            border: none;
            border-radius: 6px;
            color: var(--system-blue);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-btn:active {
            background: var(--fill-secondary);
        }

        .order-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--label-tertiary);
            font-size: 17px;
        }

        /* Utilities */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- SCREEN 1: LAUNCH -->
<div id="screen-launch" class="screen active">
    <div class="large-title-section">
        <div class="large-title">Wizard</div>
        <div class="subtitle">Card Game Scorekeeper</div>
    </div>

    <div class="content">
        <div class="list-group">
            <div class="list-header">Players</div>
            <div class="list" id="saved-players-list">
                <div class="empty-state">No saved players yet</div>
            </div>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="new-player-input" placeholder="Add player name">
            </div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-primary" id="start-game-btn" onclick="goToSeating()" style="display: none;">
            Continue
        </button>
    </div>
</div>

<!-- SCREEN 2: SEATING -->
<div id="screen-seating" class="screen">
    <div class="nav-bar">
        <button class="nav-back" onclick="goToLaunch()">
            <span>‹</span> Back
        </button>
        <div class="nav-title">Seating Order</div>
        <div style="width: 44px;"></div>
    </div>

    <div class="large-title-section">
        <div class="subtitle">Dealer sits first</div>
    </div>

    <div class="content">
        <div class="list-group">
            <div class="list" id="seating-list"></div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-primary btn-orange" onclick="startBidsEntry()">
            Start Game
        </button>
    </div>
</div>

<!-- SCREEN 3: BIDS -->
<div id="screen-bids" class="screen">
    <div class="nav-bar">
        <button class="nav-back" onclick="goBack()">
            <span>‹</span> Back
        </button>
        <div class="nav-title">Bids</div>
        <div class="round-badge" id="round-number-bids">1</div>
    </div>

    <div class="content">
        <div class="status-indicator" id="happy-indicator">
            <div class="status-icon">🤔</div>
        </div>

        <div class="list-group">
            <div class="list" id="bids-list"></div>
        </div>

        <div class="scoreboard">
            <div class="scoreboard-header">Leaderboard</div>
            <div id="scoreboard-bids"></div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-primary" onclick="confirmBids()">
            Continue
        </button>
    </div>
</div>

<!-- SCREEN 4: SCORE -->
<div id="screen-score" class="screen">
    <div class="nav-bar">
        <button class="nav-back" onclick="goToBids()">
            <span>‹</span> Back
        </button>
        <div class="nav-title">Score</div>
        <div class="round-badge" id="round-number-score">1</div>
    </div>

    <div class="content">
        <div class="list-group">
            <div class="list" id="score-list"></div>
        </div>

        <div class="scoreboard">
            <div class="scoreboard-header">Leaderboard</div>
            <div id="scoreboard-score"></div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-primary" onclick="nextRound()">
            Next Round
        </button>
    </div>
</div>

<!-- SCREEN 5: FINAL -->
<div id="screen-final" class="screen">
    <div class="nav-bar">
        <div style="width: 44px;"></div>
        <div class="nav-title">Game Over</div>
        <div style="width: 44px;"></div>
    </div>

    <div class="content">
        <div class="winner-card" id="winner-display"></div>

        <div class="list-group">
            <div class="list-header">Final Scores</div>
            <div class="list" id="final-scores-list"></div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-primary" onclick="newGame()">
            New Game
        </button>
    </div>
</div>

<script>
// Game state
let savedPlayers = [];
let selectedPlayers = [];
let gamePlayers = [];
let currentRound = 1;
let currentDealer = 0;
let rounds = [];

// Initialize
window.onload = function() {
    loadSavedPlayers();
    renderSavedPlayers();
    loadGameState();
    
    // Add input listener
    document.getElementById('new-player-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addNewPlayer();
        }
    });
};

// LocalStorage
function loadSavedPlayers() {
    const saved = localStorage.getItem('wizardSavedPlayers');
    if (saved) {
        savedPlayers = JSON.parse(saved);
    }
}

function saveSavedPlayers() {
    localStorage.setItem('wizardSavedPlayers', JSON.stringify(savedPlayers));
}

function saveGameState() {
    const state = {
        gamePlayers,
        currentRound,
        currentDealer,
        rounds,
        timestamp: new Date().toISOString()
    };
    localStorage.setItem('wizardGameState', JSON.stringify(state));
}

function loadGameState() {
    const saved = localStorage.getItem('wizardGameState');
    if (saved) {
        try {
            const state = JSON.parse(saved);
            const savedTime = new Date(state.timestamp);
            const now = new Date();
            const hoursDiff = (now - savedTime) / (1000 * 60 * 60);
            
            if (hoursDiff < 24 && state.gamePlayers && state.gamePlayers.length > 0) {
                if (confirm('Continue saved game?')) {
                    gamePlayers = state.gamePlayers;
                    currentRound = state.currentRound;
                    currentDealer = state.currentDealer;
                    rounds = state.rounds || [];
                    
                    if (currentRound <= 15) {
                        goToScreen('screen-bids');
                        renderBidsScreen();
                    } else {
                        showFinal();
                    }
                }
            }
        } catch (e) {
            console.error('Error loading game state:', e);
        }
    }
}

function clearGameState() {
    localStorage.removeItem('wizardGameState');
}

// Navigation
function goToScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function goToLaunch() {
    goToScreen('screen-launch');
}

function goToSeating() {
    if (selectedPlayers.length === 0) {
        alert('Select at least one player');
        return;
    }
    gamePlayers = [...selectedPlayers];
    renderSeatingScreen();
    goToScreen('screen-seating');
}

function goToBids() {
    renderBidsScreen();
    goToScreen('screen-bids');
}

function goToScore() {
    renderScoreScreen();
    goToScreen('screen-score');
}

function goBack() {
    if (currentRound > 1) {
        currentRound--;
        goToBids();
    } else {
        goToScreen('screen-seating');
    }
}

// SCREEN 1: Launch
function renderSavedPlayers() {
    const container = document.getElementById('saved-players-list');
    
    if (savedPlayers.length === 0) {
        container.innerHTML = '<div class="empty-state">No saved players yet</div>';
        return;
    }
    
    container.innerHTML = savedPlayers.map(name => {
        const isSelected = selectedPlayers.includes(name);
        return `
            <div class="list-item ${isSelected ? 'selected' : ''}" onclick="togglePlayer('${name}')">
                <div class="checkbox ${isSelected ? 'checked' : ''}"></div>
                <div class="list-label">${name}</div>
            </div>
        `;
    }).join('');
    
    updateStartButton();
}

function togglePlayer(name) {
    const index = selectedPlayers.indexOf(name);
    if (index > -1) {
        selectedPlayers.splice(index, 1);
    } else {
        selectedPlayers.push(name);
    }
    renderSavedPlayers();
}

function addNewPlayer() {
    const input = document.getElementById('new-player-input');
    const name = input.value.trim();
    
    if (!name) return;
    
    if (savedPlayers.includes(name)) {
        alert('Player already exists');
        return;
    }
    
    savedPlayers.push(name);
    selectedPlayers.push(name);
    saveSavedPlayers();
    renderSavedPlayers();
    input.value = '';
}

function updateStartButton() {
    const btn = document.getElementById('start-game-btn');
    btn.style.display = selectedPlayers.length > 0 ? 'block' : 'none';
}

// SCREEN 2: Seating
function renderSeatingScreen() {
    const container = document.getElementById('seating-list');
    container.innerHTML = gamePlayers.map((name, index) => `
        <div class="list-item ${index === 0 ? 'dealer' : ''}">
            <div class="list-label ${index === 0 ? 'dealer' : ''}">
                ${name}
            </div>
            <div class="order-controls">
                <button class="order-btn" onclick="movePlayer(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
                <button class="order-btn" onclick="movePlayer(${index}, 1)" ${index === gamePlayers.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
        </div>
    `).join('');
}

function movePlayer(index, direction) {
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= gamePlayers.length) return;
    
    const temp = gamePlayers[index];
    gamePlayers[index] = gamePlayers[newIndex];
    gamePlayers[newIndex] = temp;
    
    renderSeatingScreen();
}

function startBidsEntry() {
    currentRound = 1;
    currentDealer = 0;
    rounds = [];
    renderBidsScreen();
    goToScreen('screen-bids');
    saveGameState();
}

// SCREEN 3: Bids
function renderBidsScreen() {
    document.getElementById('round-number-bids').textContent = currentRound;
    
    if (!rounds[currentRound - 1]) {
        rounds[currentRound - 1] = {
            bids: new Array(gamePlayers.length).fill(null),
            tricks: new Array(gamePlayers.length).fill(null)
        };
    }
    
    const round = rounds[currentRound - 1];
    const container = document.getElementById('bids-list');
    
    container.innerHTML = gamePlayers.map((name, index) => {
        const isDealer = index === currentDealer;
        const bid = round.bids[index];
        return `
            <div class="score-entry ${isDealer ? 'dealer' : ''}">
                <div class="entry-info">
                    <div class="entry-name ${isDealer ? 'dealer' : ''}">${name}</div>
                    ${isDealer ? '<div class="entry-detail">Dealer</div>' : ''}
                </div>
                <div class="entry-controls">
                    <button class="control-btn green" onclick="changeBid(${index}, -1)">−</button>
                    <div class="control-value" id="bid-${index}">${bid !== null ? bid : '?'}</div>
                    <button class="control-btn green" onclick="changeBid(${index}, 1)">+</button>
                </div>
            </div>
        `;
    }).join('');
    
    updateHappyIndicator();
    renderScoreboard('scoreboard-bids', true);
}

function changeBid(playerIndex, delta) {
    const round = rounds[currentRound - 1];
    let currentBid = round.bids[playerIndex];
    
    if (currentBid === null) {
        if (delta < 0) {
            round.bids[playerIndex] = 0;
            document.getElementById(`bid-${playerIndex}`).textContent = 0;
            updateHappyIndicator();
            saveGameState();
            return;
        } else {
            currentBid = 0;
        }
    }
    
    const newBid = currentBid + delta;
    
    if (newBid < 0 || newBid > currentRound) return;
    
    round.bids[playerIndex] = newBid;
    document.getElementById(`bid-${playerIndex}`).textContent = newBid;
    
    updateHappyIndicator();
    saveGameState();
}

function updateHappyIndicator() {
    const round = rounds[currentRound - 1];
    const allBids = round.bids.every(b => b !== null);
    const sum = round.bids.reduce((acc, b) => acc + (b || 0), 0);
    
    const indicator = document.getElementById('happy-indicator');
    const icon = indicator.querySelector('.status-icon');
    
    if (!allBids) {
        indicator.className = 'status-indicator';
        icon.textContent = '🤔';
    } else if (sum === currentRound) {
        indicator.className = 'status-indicator happy';
        icon.textContent = '😊';
    } else {
        indicator.className = 'status-indicator unhappy';
        icon.textContent = '😐';
    }
}

function confirmBids() {
    const round = rounds[currentRound - 1];
    const allBids = round.bids.every(b => b !== null);
    
    if (!allBids) {
        alert('Enter bids for all players');
        return;
    }
    
    goToScore();
}

// SCREEN 4: Score
function renderScoreScreen() {
    document.getElementById('round-number-score').textContent = currentRound;
    
    const round = rounds[currentRound - 1];
    const container = document.getElementById('score-list');
    
    container.innerHTML = gamePlayers.map((name, index) => {
        const isDealer = index === currentDealer;
        const bid = round.bids[index];
        const tricks = round.tricks[index];
        const points = calculateRoundPoints(bid, tricks);
        
        return `
            <div class="score-entry ${isDealer ? 'dealer' : ''}">
                <div class="entry-info">
                    <div class="entry-name ${isDealer ? 'dealer' : ''}">${name}</div>
                    <div class="entry-detail">
                        Bid: <span class="entry-bid">${bid}</span>
                        ${tricks !== null ? `<span class="entry-points ${points >= 0 ? 'positive' : 'negative'}">${points >= 0 ? '+' : ''}${points}</span>` : ''}
                    </div>
                </div>
                <div class="entry-controls">
                    <button class="control-btn orange" onclick="changeTricks(${index}, -1)">−</button>
                    <div class="control-value" id="tricks-${index}">${tricks !== null ? tricks : '?'}</div>
                    <button class="control-btn orange" onclick="changeTricks(${index}, 1)">+</button>
                </div>
            </div>
        `;
    }).join('');
    
    renderScoreboard('scoreboard-score', true);
}

function changeTricks(playerIndex, delta) {
    const round = rounds[currentRound - 1];
    let currentTricks = round.tricks[playerIndex];
    
    if (currentTricks === null) {
        if (delta < 0) {
            round.tricks[playerIndex] = 0;
            renderScoreScreen();
            saveGameState();
            return;
        } else {
            currentTricks = 0;
        }
    }
    
    const newTricks = currentTricks + delta;
    
    if (newTricks < 0 || newTricks > currentRound) return;
    
    const totalTricks = round.tricks.reduce((sum, t, idx) => {
        if (idx === playerIndex) return sum + newTricks;
        return sum + (t || 0);
    }, 0);
    
    if (totalTricks > currentRound) return;
    
    round.tricks[playerIndex] = newTricks;
    
    renderScoreScreen();
    saveGameState();
}

function calculateRoundPoints(bid, tricks) {
    if (tricks === null) return 0;
    
    if (bid === tricks) {
        return 20 + (tricks * 10);
    } else {
        return -10 * Math.abs(bid - tricks);
    }
}

function nextRound() {
    const round = rounds[currentRound - 1];
    const allTricks = round.tricks.every(t => t !== null);
    
    if (!allTricks) {
        alert('Enter tricks for all players');
        return;
    }
    
    if (currentRound >= 15) {
        showFinal();
        return;
    }
    
    currentRound++;
    currentDealer = (currentDealer + 1) % gamePlayers.length;
    
    goToBids();
    saveGameState();
}

// Scoreboard
function renderScoreboard(containerId, sortByScore) {
    const container = document.getElementById(containerId);
    
    const scores = gamePlayers.map((name, index) => {
        let total = 0;
        
        for (let r = 0; r < rounds.length; r++) {
            const round = rounds[r];
            if (round && round.tricks && round.tricks[index] !== null) {
                total += calculateRoundPoints(round.bids[index], round.tricks[index]);
            }
        }
        
        return { name, total, index };
    });
    
    if (sortByScore) {
        scores.sort((a, b) => {
            if (b.total !== a.total) {
                return b.total - a.total;
            }
            return a.index - b.index;
        });
    }
    
    container.innerHTML = scores.map(s => `
        <div class="scoreboard-item">
            <div class="scoreboard-name">${s.name}</div>
            <div class="scoreboard-value ${s.total > 0 ? 'positive' : s.total < 0 ? 'negative' : ''}">${s.total}</div>
        </div>
    `).join('');
}

// SCREEN 5: Final
function showFinal() {
    const scores = gamePlayers.map((name, index) => {
        let total = 0;
        for (let r = 0; r < rounds.length; r++) {
            const round = rounds[r];
            if (round.tricks[index] !== null) {
                total += calculateRoundPoints(round.bids[index], round.tricks[index]);
            }
        }
        return { name, total };
    });
    
    scores.sort((a, b) => b.total - a.total);
    
    const winner = scores[0];
    
    document.getElementById('winner-display').innerHTML = `
        <div class="winner-label">Winner</div>
        <div class="winner-name">${winner.name}</div>
        <div class="winner-score">${winner.total}</div>
    `;
    
    const finalList = document.getElementById('final-scores-list');
    finalList.innerHTML = scores.map((s, index) => `
        <div class="list-item">
            <div class="list-label">${index + 1}. ${s.name}</div>
            <div class="scoreboard-value ${s.total > 0 ? 'positive' : s.total < 0 ? 'negative' : ''}">${s.total}</div>
        </div>
    `).join('');
    
    goToScreen('screen-final');
    clearGameState();
}

function newGame() {
    if (confirm('Start a new game?')) {
        selectedPlayers = [];
        gamePlayers = [];
        currentRound = 1;
        currentDealer = 0;
        rounds = [];
        clearGameState();
        goToLaunch();
        renderSavedPlayers();
    }
}
</script>
